#? Config file for btop. Copland OS look; btop fills in defaults for anything not set here.

#* Copland OS Enterprise theme (themes/copland.theme)
color_theme = "copland"

#* Transparent background so the xfce4-terminal translucency and wallpaper show through
theme_background = False

#* 24-bit colour for the theme's gradients
truecolor = True

#* Square box corners, matching the fastfetch frames
rounded_corners = False

#* Braille graphs: fine-grained, like the Wired's static
graph_symbol = "braille"
