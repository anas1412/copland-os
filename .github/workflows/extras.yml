# Test copland-extras for real on GitHub's runners: every item installed into a clean
# debian:trixie container, then checked (tests/test-extras.sh), plus a run without a
# network. Nothing here is published; it only reads the repository.
# Started by hand only (Actions tab, copland-extras, Run workflow).
name: copland-extras

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extras-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-everything:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install and check every item in debian:trixie
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src:ro" debian:trixie /src/tests/test-extras.sh

      - name: Without a network
        run: |
          docker run --rm --network none -v "$GITHUB_WORKSPACE:/src:ro" debian:trixie \
            /src/tests/test-extras.sh --offline
