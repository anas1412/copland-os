# Build CoplandOS.iso on GitHub's runners (free for public repositories: 4 CPUs,
# 16 GB RAM, 6-hour limit). Runs on a push to main that changes something inside the
# image, or by hand from the Actions tab. The build itself runs in a clean debian:trixie
# container with iso/ci-build.sh; no secret is needed (the ISO only carries the
# public key in packaging/).
#
# A version tag (matching COPLAND_VERSION in iso/release.conf) is a release; pushing it is
# the decision to release. What a release contains depends on the version:
#   v0.2.0 (minor or major): the image and its package. Published as the latest release,
#          so the website's download button follows it at once.
#   v0.2.1 (patch): the package alone, no image. Installed systems get it through the
#          update icon or apt; new installs use the latest image and then update.
# Either way the release carries the package, and packaging/publish-repo.sh puts that
# very file in the apt repository: one version, one build. Every other build (pushes to
# main, manual runs) is labelled <next version>~git<time>.<commit> (packaging/build-version.sh),
# so it never shares a version with a release.
name: CoplandOS.iso

on:
  workflow_dispatch:
  # only files that end up in the image; README, docs/ and site/ never start a build
  push:
    branches: [main]
    paths:
      - 'iso/**'
      - 'core/**'
      - 'lib/**'
      - 'tools/**'
      - 'packaging/**'
      - 'install.sh'
      - '.github/workflows/iso.yml'
    # a release; GitHub does not apply the paths above to tag pushes
    tags: ['v*']

# read the repository, nothing else
permissions:
  contents: read

# one build per branch at a time: a new push cancels the older build (only the newest
# commit matters); a manual start waits for the running build instead
concurrency:
  group: iso-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  # the image: every push and manual run, and minor or major release tags (v0.2.0)
  build:
    if: github.ref_type != 'tag' || endsWith(github.ref_name, '.0')
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      name: ${{ steps.release.outputs.name }}
      version: ${{ steps.release.outputs.version }}
      debian: ${{ steps.release.outputs.debian }}
    steps:
      # actions are pinned to a commit, not a tag: a moved tag cannot change what runs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read iso/release.conf
        id: release
        run: |
          . iso/release.conf
          # a release tag must name the version the image is built as, or stop before building
          if [ "${GITHUB_REF_TYPE:-}" = tag ] && [ "$GITHUB_REF_NAME" != "v$COPLAND_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match COPLAND_VERSION=$COPLAND_VERSION in iso/release.conf (expected v$COPLAND_VERSION)."
            exit 1
          fi
          # a tag builds the release itself; anything else is a labelled test build
          if [ "${GITHUB_REF_TYPE:-}" = tag ]; then export COPLAND_RELEASE=1; fi
          label="$(packaging/build-version.sh)"
          echo "COPLAND_BUILD_VERSION=$label" >> "$GITHUB_ENV"
          echo "codename=$DEBIAN_CODENAME" >> "$GITHUB_OUTPUT"
          echo "version=$label" >> "$GITHUB_OUTPUT"
          echo "debian=$DEBIAN_VERSION ($DEBIAN_CODENAME)" >> "$GITHUB_OUTPUT"
          echo "name=CoplandOS-$label-deb$DEBIAN_VERSION-amd64" >> "$GITHUB_OUTPUT"

      # build on whichever disk has the most room. GitHub's docs promise 14 GB; the first
      # run found 86 GB free on /, so no SDKs are deleted (that took 7 minutes). If a
      # runner ever has less, build.sh stops at its free-space check with a clear message.
      - name: Pick the work disk
        run: |
          df -h / /mnt
          best=/ ; bestfree=0
          for d in / /mnt; do
            free=$(df -Pk "$d" | awk 'NR==2 {print $4}')
            if [ "$free" -gt "$bestfree" ]; then best=$d; bestfree=$free; fi
          done
          work="${best%/}/coplandos"
          sudo mkdir -p "$work/build" && sudo chown -R "$(id -u):$(id -g)" "$work"
          echo "WORK=$work" >> "$GITHUB_ENV"
          echo "Work disk: $best, $((bestfree / 1024 / 1024)) GB free"

      # live-build keeps every downloaded .deb in its cache folder; restoring it means a
      # build only downloads what changed. The key changes with the package list, so a
      # new list starts from the closest older cache.
      - name: Restore the package cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # only the downloaded .debs: live-build's cached base system holds device files
          path: |
            ${{ env.WORK }}/build/cache/packages.bootstrap
            ${{ env.WORK }}/build/cache/packages.chroot
            ${{ env.WORK }}/build/cache/packages.binary
          key: lb-${{ steps.release.outputs.codename }}-${{ hashFiles('iso/config/package-lists/**', 'iso/auto/config', 'iso/release.conf') }}-${{ github.run_id }}
          restore-keys: |
            lb-${{ steps.release.outputs.codename }}-${{ hashFiles('iso/config/package-lists/**', 'iso/auto/config', 'iso/release.conf') }}-
            lb-${{ steps.release.outputs.codename }}-

      - name: Build in debian:trixie
        run: |
          docker pull -q debian:trixie
          image="$(docker image inspect --format '{{index .RepoDigests 0}}' debian:trixie)"
          echo "Container: $image"
          docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE:/src" -v "$WORK:/work" \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            -e COPLAND_BUILD_IMAGE="$image" -e COPLAND_BUILD_VERSION \
            -e GITHUB_SERVER_URL -e GITHUB_REPOSITORY -e GITHUB_RUN_ID \
            "$image" /src/iso/ci-build.sh

      - name: Check the package cache
        id: cached
        if: always()
        run: |
          n=$(find "$WORK/build/cache" -name '*.deb' 2>/dev/null | wc -l)
          echo "debs=$n" >> "$GITHUB_OUTPUT"
          echo "$n packages in the cache ($(du -sh "$WORK/build/cache" 2>/dev/null | cut -f1))"

      # saved even when the build failed: the downloads are still good for the next run
      - name: Save the package cache
        if: always() && steps.cache.outcome == 'success' && steps.cached.outputs.debs != '0'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # only the downloaded .debs: live-build's cached base system holds device files
          path: |
            ${{ env.WORK }}/build/cache/packages.bootstrap
            ${{ env.WORK }}/build/cache/packages.chroot
            ${{ env.WORK }}/build/cache/packages.binary
          key: ${{ steps.cache.outputs.cache-primary-key }}

      # the ISO as a plain file, not zipped: it is downloaded and written to USB as is
      - name: Upload the ISO
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: iso/out/${{ steps.release.outputs.name }}.iso
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Upload the checksum and build record
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.release.outputs.name }}-record
          path: |
            iso/out/*.sha256
            iso/out/*.build-info.txt
            iso/out/*.packages
            iso/out/*.deb
            iso/out/*.log
          if-no-files-found: warn
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          {
            echo "### ${{ steps.release.outputs.name }}"
            if [ -f "iso/out/${{ steps.release.outputs.name }}.iso" ]; then
              echo "- size: $(du -h "iso/out/${{ steps.release.outputs.name }}.iso" | cut -f1)"
              echo "- sha256: \`$(cut -d' ' -f1 "iso/out/${{ steps.release.outputs.name }}.iso.sha256")\`"
            else
              echo "- no image: read build.log in the record artifact"
            fi
            echo "- package cache: ${{ steps.cache.outputs.cache-matched-key || 'none (first build)' }}"
            df -h "$WORK" | awk 'NR==2 {print "- work disk after the build: " $4 " free"}'
          } >> "$GITHUB_STEP_SUMMARY"

  # Only for a patch tag (v0.2.1): the package alone, built from the tag in a clean
  # Debian container, the same way the image build makes it.
  package:
    if: github.ref_type == 'tag' && !endsWith(github.ref_name, '.0')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      debian: ${{ steps.release.outputs.debian }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read iso/release.conf
        id: release
        run: |
          . iso/release.conf
          if [ "$GITHUB_REF_NAME" != "v$COPLAND_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match COPLAND_VERSION=$COPLAND_VERSION in iso/release.conf (expected v$COPLAND_VERSION)."
            exit 1
          fi
          echo "debian=$DEBIAN_VERSION ($DEBIAN_CODENAME)" >> "$GITHUB_OUTPUT"

      - name: Build the package in debian:trixie
        run: |
          docker pull -q debian:trixie
          image="$(docker image inspect --format '{{index .RepoDigests 0}}' debian:trixie)"
          echo "Container: $image"
          docker run --rm -v "$GITHUB_WORKSPACE:/src" \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" -e COPLAND_RELEASE=1 \
            "$image" /src/packaging/ci-build-deb.sh

      - name: Upload the package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: packaging/out/*.deb
          if-no-files-found: error
          retention-days: 30

  # Only for a version tag: publish what was built above as a release. This is the only
  # job that may write to the repository, and it runs no build code.
  release:
    if: >-
      always() && github.ref_type == 'tag' &&
      (needs.build.result == 'success' || needs.package.result == 'success')
    needs: [build, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Download the ISO
        if: needs.build.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.name }}.iso
          path: out

      - name: Download the checksum, build record and package
        if: needs.build.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.name }}-record
          path: out

      - name: Download the package
        if: needs.package.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: out

      - name: Check the checksum
        if: needs.build.result == 'success'
        working-directory: out
        run: sha256sum -c "${{ needs.build.outputs.name }}.iso.sha256"

      - name: Publish the release
        working-directory: out
        env:
          GH_TOKEN: ${{ github.token }}
          KIND: ${{ needs.build.result == 'success' && 'image' || 'package' }}
          NAME: ${{ needs.build.outputs.name }}
          DEBIAN: ${{ needs.build.outputs.debian || needs.package.outputs.debian }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          deb="$(ls copland-os-desktop_"$version"+deb*_all.deb)"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ "$KIND" = image ]; then
            sha="$(cut -d' ' -f1 "$NAME.iso.sha256")"
            cat > notes.md <<EOF
          Copland OS $version, on Debian $DEBIAN.

          **Download** \`$NAME.iso\` below, put it on a USB stick and start your PC from it:
          https://anas1412.github.io/copland-os/#wired

          **Check the download** (optional): in the folder with both files, run
          \`sha256sum -c $NAME.iso.sha256\`. The SHA-256 is \`$sha\`.

          Already running Copland OS? The update icon in the top bar brings you this version.

          Built by GitHub Actions from commit $GITHUB_SHA: $run_url
          The build record, the list of every package in the image and the
          \`copland-os-desktop\` package (the one in the apt repository) are attached.
          EOF
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --latest --verify-tag \
              --title "Copland OS $version" --notes-file notes.md \
              "$NAME.iso" "$NAME.iso.sha256" "$NAME.build-info.txt" "$NAME.packages" "$deb"
          else
            cat > notes.md <<EOF
          Copland OS $version, an update for Debian $DEBIAN. No new image.

          **Already running Copland OS?** The update icon in the top bar brings it, or
          \`sudo apt update && sudo apt upgrade\`.

          **New install?** Use the latest image, then update.

          Built by GitHub Actions from commit $GITHUB_SHA: $run_url
          The \`copland-os-desktop\` package attached is the one in the apt repository.
          EOF
            # not "latest": the website's download button keeps pointing at the newest image
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --latest=false --verify-tag \
              --title "Copland OS $version" --notes-file notes.md "$deb"
          fi
          echo "Released ($KIND): $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
