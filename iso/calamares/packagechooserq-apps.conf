# Copland OS installer: the "Apps" page. The page itself is QML,
# /etc/calamares/branding/copland/choose-apps.qml (from iso/branding/), a checklist built
# from CoplandChooser.qml. What is ticked is stored as packagechooser_apps (a comma-
# separated list of copland-extras ids) and installed by the copland-extras job.
---
method: legacy
qmlSearch: both
qmlFilename: /etc/calamares/branding/copland/choose-apps.qml
labels:
    step: "Apps"
