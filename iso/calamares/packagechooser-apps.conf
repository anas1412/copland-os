# Copland OS installer: the "Apps" page. Nothing is ticked by default: the plain install
# stays small and works offline. What is ticked here is installed at the end of the
# install by copland-extras (core/bin/copland-extras), which also gives each app the
# Copland look. Ids must match copland-extras --list. Sizes: docs/DESIGN.md.
---
mode: optionalmultiple
method: legacy
labels:
    step: "Apps"
items:
    - id: ""
      name: "Apps"
      description: "Tick the apps you want. They are downloaded at the end of the install, so they need an internet connection; without one, the install finishes without them and you can add them later with copland-extras. Everything comes from Debian unless the item says otherwise."
      screenshot: "choose-apps.png"
    - id: brave
      name: "Brave Origin"
      description: "Brave without its AI, Rewards, Wallet and VPN; ad and tracker blocking stays. Becomes the default browser, in the Copland colour. Firefox stays installed. From Brave's own repository."
      screenshot: "choose-brave.png"
    - id: libreoffice
      name: "LibreOffice"
      description: "Writer for documents, Calc for spreadsheets, Impress for presentations. Opens and saves Microsoft Office files."
      screenshot: "choose-libreoffice.png"
    - id: thunderbird
      name: "Thunderbird"
      description: "Mail, calendar and contacts."
      screenshot: "choose-thunderbird.png"
    - id: gimp
      name: "GIMP"
      description: "Photo and image editor, set to the desktop's colours."
      screenshot: "choose-gimp.png"
    - id: vlc
      name: "VLC"
      description: "Plays almost any video and music file, DVDs and streams."
      screenshot: "choose-vlc.png"
    - id: obs
      name: "OBS Studio"
      description: "Screen recording and live streaming, with a Copland theme."
      screenshot: "choose-obs.png"
    - id: keepassxc
      name: "KeePassXC"
      description: "Password manager. Your passwords stay in one encrypted file on this computer."
      screenshot: "choose-keepassxc.png"
    - id: flatpak
      name: "Flatpak and Flathub"
      description: "Adds Flathub, where apps like Steam, Discord and Spotify are one click away in a sandbox. Flathub is run by the Flatpak project, not Debian."
      screenshot: "choose-flatpak.png"
