# Copland OS installer: the "Developer tools" page. Same rules as packagechooser-apps.conf.
# Languages come from wherever their current version is: Debian when Debian has it,
# Debian's backports for Go, rustup for Rust, the maker's repository for Node.js.
---
mode: optionalmultiple
method: legacy
labels:
    step: "Developer tools"
items:
    - id: ""
      name: "Developer tools"
      description: "Tick the languages and tools you work with. Each one is a current, supported version. Git and curl are already installed."
      screenshot: "choose-dev.png"
    - id: vscode
      name: "Visual Studio Code"
      description: "Code editor, in the Copland colours and window frame, telemetry off. From Microsoft's repository."
      screenshot: "choose-vscode.png"
    - id: python
      name: "Python"
      description: "Python 3 with pip, venv and pipx for apps and projects."
      screenshot: "choose-python.png"
    - id: node
      name: "Node.js"
      description: "The current LTS release with npm. From NodeSource's repository: Debian's Node.js 20 has reached its end of life."
      screenshot: "choose-node.png"
    - id: go
      name: "Go"
      description: "The current Go release, from Debian's backports."
      screenshot: "choose-go.png"
    - id: rust
      name: "Rust"
      description: "rustup with the current stable toolchain, installed for your account. Update it any time with rustup update."
      screenshot: "choose-rust.png"
    - id: java
      name: "Java"
      description: "OpenJDK 25, the current long-term release."
      screenshot: "choose-java.png"
    - id: cpp
      name: "C and C++"
      description: "gcc, g++, make, cmake and gdb."
      screenshot: "choose-cpp.png"
    - id: docker
      name: "Docker"
      description: "Docker Engine with Compose and Buildx; your account can use it without sudo after the first login. From Docker's repository."
      screenshot: "choose-docker.png"
    - id: podman
      name: "Podman"
      description: "Containers without a background service or root, with podman-compose."
      screenshot: "choose-podman.png"
