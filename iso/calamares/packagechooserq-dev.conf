# Copland OS installer: the "Developer tools" page. The page itself is QML,
# /etc/calamares/branding/copland/choose-dev.qml (from iso/branding/), a checklist built
# from CoplandChooser.qml. What is ticked is stored as packagechooser_dev (a comma-
# separated list of copland-extras ids) and installed by the copland-extras job.
---
method: legacy
qmlSearch: both
qmlFilename: /etc/calamares/branding/copland/choose-dev.qml
labels:
    step: "Developer tools"
