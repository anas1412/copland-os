set default=0

if [ x$feature_default_font_path = xy ] ; then
    font=unicode
else
    font=$prefix/unicode.pf2
fi

# Copland OS: live-build's config.cfg (live-build 1:20250505), with one change:
# the screen's own preferred mode ("auto", from its EDID) instead of 800x600, and
# "keep" hands it to Linux, so the menu, the boot animation and the desktop share one
# resolution. Copied from the netinst image originally.
if loadfont $font ; then
    set gfxmode=auto
    set gfxpayload=keep
    insmod efi_gop
    insmod efi_uga
    insmod video_bochs
    insmod video_cirrus
else
    set gfxmode=auto
    insmod all_video
fi

insmod gfxterm
insmod png

source /boot/grub/theme.cfg

terminal_output gfxterm

insmod play
play 960 440 1 0 4 440 1
