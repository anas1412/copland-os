# What CoplandOS.iso and the Debian package are built as. This is the only place
# these are set: iso/build.sh, packaging/build-deb.sh and packaging/publish-repo.sh
# read this file.
#
# COPLAND_VERSION: the NEXT release of Copland OS (major.minor.patch). Raise it right
# after a release, so main always says what it is working towards. The release build
# (CI, from tag v<version>) is exactly this version; every other build is labelled
# <version>~git<time>.<commit> (packaging/build-version.sh), which apt sorts below it.
#   x.y.0  a minor or major release: a new image and the package
#   x.y.z  a patch release: the package only, delivered by the update icon and apt
# Changes to the image itself (installer, live session, boot menu) need a minor release.
#
# DEBIAN_CODENAME, DEBIAN_VERSION: the Debian release the image is built on. To move
# to a new release, change both, then follow "Moving to a new Debian release" in
# docs/BUILDING.md.
COPLAND_VERSION=0.2.1
DEBIAN_CODENAME=trixie
DEBIAN_VERSION=13

# Where the signed apt repository is served (GitHub Pages, gh-pages branch). The ISO's
# apt source points here, so installed systems get Copland updates with apt;
# packaging/publish-repo.sh publishes to it.
COPLAND_APT_URL=https://anas1412.github.io/copland-os/apt
